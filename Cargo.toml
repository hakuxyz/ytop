[package]
name = "ytop"
version = "0.8.0"
authors = ["Caleb Bassi <calebjbassi@gmail.com>", "haku <beamzbyhakz@proton.me>"]
license = "MIT"
description = "A TUI system monitor written in Rust"
edition = "2018"
repository = "https://github.com/hakuxyz/ytop"

[dependencies]
better-panic = "0.2.0"
chrono = "0.4.11"
crossbeam-channel = "0.4.2"
ctrlc = { version = "3.1.4", features = ["termination"] }
fern = "0.6.0"
log = "0.4.8"
num-rational = "0.2.4"
once_cell = "1.3.1"
platform-dirs = "0.2.0"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
serde = { version = "1.0.110", features = ["derive"] }
serde_json = "1.0.53"
size = "0.1.2"
structopt = "0.3.14"

# psutil only supports Linux and macOS, and the battery crate's FreeBSD backend
# does not build against current libc, so both are replaced by src/sys on FreeBSD.
[target.'cfg(not(target_os = "freebsd"))'.dependencies]
battery = "0.7.5"
psutil = "5.4.0"

[target.'cfg(target_os = "freebsd")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
sysinfo = "0.14.1"
