name: Publish Binaries

on:
  release:
    types:
      - created
  # Releases are created with the workflow's GITHUB_TOKEN, which does not fire
  # the release event above, so create-release.yml dispatches this workflow
  # explicitly instead.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish the binaries for
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package release
        run: tar -czf ytop-${{ inputs.tag || github.event.release.tag_name }}-${{ matrix.target }}.tar.gz -C ./target/${{ matrix.target }}/release/ ytop

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: ytop-${{ inputs.tag || github.event.release.tag_name }}-${{ matrix.target }}.tar.gz

  # The FreeBSD binary cannot be cross-linked from Linux or macOS, so it is
  # built inside a real FreeBSD VM.
  publish-freebsd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Build release binary on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14'
          prepare: |
            pkg install -y curl
            curl -o /tmp/rustup-init https://sh.rustup.rs
            sh /tmp/rustup-init -y --default-toolchain stable --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            cargo build --release

      - name: Package release
        run: tar -czf ytop-${{ inputs.tag || github.event.release.tag_name }}-x86_64-unknown-freebsd.tar.gz -C ./target/release/ ytop

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.event.release.tag_name }}
          files: ytop-${{ inputs.tag || github.event.release.tag_name }}-x86_64-unknown-freebsd.tar.gz
